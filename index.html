<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TJSP Questões">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f5c63">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TJSP Escrevente – Questões offline</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1f2a2e;--mut:#667074;--line:#ddd6c8;--acc:#0f5c63;--accs:#e0eeee;--ok:#1d7a46;--oks:#e1f3e7;--bad:#b3362b;--bads:#fbe6e3;--warn:#9a6a00;--warns:#fcf1d4}
@media(prefers-color-scheme:dark){:root{--bg:#141a1c;--card:#1d2528;--ink:#e9ece9;--mut:#9aa5a7;--line:#324044;--acc:#6cc5cb;--accs:#1f3a3d;--ok:#6fd398;--oks:#193525;--bad:#f08b80;--bads:#44211d;--warn:#e9c05c;--warns:#3d3214}}
*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top);background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;-webkit-text-size-adjust:100%}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:.2em 0 .1em}h2{font-size:1.1rem;margin:1.2em 0 .5em}h3{font-size:1rem;margin:.2em 0}
p{margin:.4em 0}.mut{color:var(--mut);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
button,select,textarea,input{font:inherit;color:inherit}
.btn{display:inline-block;background:var(--acc);color:var(--card);border:0;border-radius:10px;padding:12px 18px;font-weight:600;min-height:46px;cursor:pointer}
.btn.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:.88rem;color:var(--mut);margin:10px 0 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:164px;background:none;border:0;padding:10px 2px 12px;font-size:.78rem;color:var(--mut);cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--acc);border-top-color:var(--acc);font-weight:700}
.enun{white-space:pre-wrap;font-size:1.02rem}
.alt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;min-height:50px}
.alt b{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:.85rem}
.alt.sel{border-color:var(--acc);background:var(--accs)}
.alt.ok{border-color:var(--ok);background:var(--oks)}.alt.bad{border-color:var(--bad);background:var(--bads)}
.tag{display:inline-block;font-size:.76rem;padding:2px 8px;border-radius:99px;background:var(--accs);color:var(--acc);margin:0 4px 4px 0}
.tag.w{background:var(--warns);color:var(--warn)}.tag.b{background:var(--bads);color:var(--bad)}.tag.g{background:var(--oks);color:var(--ok)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--warns);border-color:var(--warn);color:var(--warn);font-weight:600}
.bar{position:relative;height:12px;background:var(--line);border-radius:99px;margin:6px 0 2px;overflow:visible}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar i.low{background:var(--bad)}
.bar u{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.fb{border-radius:12px;padding:12px;margin:10px 0;font-weight:600}
.fb.ok{background:var(--oks);color:var(--ok)}.fb.bad{background:var(--bads);color:var(--bad)}.fb.warn{background:var(--warns);color:var(--warn)}
.big{font-size:1.7rem;font-weight:700;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
details summary{cursor:pointer;padding:4px 0}
.line{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
</style>
</head>
<body>
<main id="main"></main>
<nav id="nav"></nav>
<script>
"use strict";
/* ===== Estrutura do Edital nº 02/2026 (Anexo VIII) ===== */
const BLOCOS=[
 {id:'I',nome:'Bloco I – Língua Portuguesa',n:16,min:8,elim:true},
 {id:'II',nome:'Bloco II – Conhecimentos em Direito',n:30,min:15,elim:true},
 {id:'III',nome:'Bloco III – Conhecimentos Gerais',n:24,min:0,elim:false}];
const DISC=[
 {id:'lp',b:'I',nome:'Língua Portuguesa',t:[
  ['lp1','Interpretação de textos; informações literais e inferências; ponto de vista do autor (itens 1 a 3)'],
  ['lp4','Estruturação do texto: relações entre ideias; coesão (item 4)'],
  ['lp5','Significação de palavras; sinônimos e antônimos; sentido próprio e figurado (itens 5 a 7)'],
  ['lp8','Classes de palavras: emprego e sentido (item 8)'],
  ['lp9','Concordância verbal e nominal (item 9)'],
  ['lp10','Regência verbal e nominal (item 10)'],
  ['lp11','Colocação pronominal (item 11)'],
  ['lp12','Crase (item 12)'],
  ['lp13','Pontuação (item 13)']]},
 {id:'dp',b:'II',nome:'Direito Penal',t:[
  ['dp1','CP arts. 293 a 305, 307, 308 e 311-A – crimes contra a fé pública'],
  ['dp2','CP arts. 312 a 317 e 319 a 327 – crimes praticados por funcionário público'],
  ['dp3','CP arts. 328 a 333, 336 e 337 – crimes praticados por particular contra a Administração'],
  ['dp4','CP arts. 339 a 347, 357 e 359 – crimes contra a administração da Justiça']]},
 {id:'dpp',b:'II',nome:'Direito Processual Penal',t:[
  ['dpp1','CPP arts. 251 a 258, 261 a 267 e 274 – juiz, MP, acusado, defensor e funcionários da Justiça'],
  ['dpp2','CPP arts. 351 a 372 – citações e intimações'],
  ['dpp3','CPP arts. 394 a 405 – procedimento comum'],
  ['dpp4','CPP arts. 406 a 497 – Tribunal do Júri'],
  ['dpp5','CPP arts. 531 a 538 – procedimento sumário'],
  ['dpp6','CPP arts. 541 a 548 – restauração de autos'],
  ['dpp7','CPP arts. 574 a 667 – recursos e habeas corpus'],
  ['dpp8','Lei 9.099/95 arts. 60 a 83, 88 e 89 – Juizado Especial Criminal']]},
 {id:'dpc',b:'II',nome:'Direito Processual Civil',t:[
  ['dpc1','CPC arts. 144 a 155 – impedimento, suspeição e auxiliares da Justiça'],
  ['dpc2','CPC arts. 188 a 275 – atos processuais, prazos, citação e intimações'],
  ['dpc3','CPC arts. 294 a 311 – tutela provisória'],
  ['dpc4','CPC arts. 318 a 512 – procedimento comum'],
  ['dpc5','CPC arts. 513 a 538 – cumprimento de sentença'],
  ['dpc6','CPC arts. 994 a 1.026 – recursos'],
  ['dpc7','Lei 9.099/95 arts. 3º a 19 – Juizado Especial Cível'],
  ['dpc8','Lei 12.153/2009 – Juizados Especiais da Fazenda Pública']]},
 {id:'dc',b:'II',nome:'Direito Constitucional',t:[
  ['dc1','CF Título II, Cap. I – direitos e deveres individuais e coletivos (art. 5º)'],
  ['dc2','CF Título II, Cap. II – direitos sociais (arts. 6º a 11)'],
  ['dc3','CF Título II, Cap. III – nacionalidade (arts. 12 e 13)'],
  ['dc4','CF Título III, Cap. VII, Seções I e II – Administração Pública e servidores (arts. 37 a 41)'],
  ['dc5','CF art. 92 – órgãos do Poder Judiciário']]},
 {id:'da',b:'II',nome:'Direito Administrativo',t:[
  ['da1','Lei 10.261/68 (Estatuto) – arts. 1º a 86'],
  ['da2','Lei 10.261/68 (Estatuto) – arts. 171 a 175'],
  ['da3','Lei 10.261/68 (Estatuto) – arts. 239 a 323'],
  ['da4','Lei 8.429/92 – Improbidade Administrativa']]},
 {id:'li',b:'II',nome:'Legislação Interna',t:[
  ['li1','Resolução TJSP 850/2021 – teletrabalho'],
  ['li2','Resolução TJSP 963/2025 – sistema eproc'],
  ['li3','LC 1.111/2010 – Plano de Cargos e Carreiras'],
  ['li4','Regimento Interno do TJSP'],
  ['li5','Normas da Corregedoria Geral da Justiça (Tomo I, Caps. II, III e XI)']]},
 {id:'at',b:'III',nome:'Atualidades',t:[
  ['at1','Fatos políticos, econômicos, sociais e culturais a partir do 1º semestre de 2026'],
  ['at2','Lei 13.146/2015 (Estatuto da Pessoa com Deficiência) – arts. 1º a 13 e 34 a 38']]},
 {id:'mat',b:'III',nome:'Matemática',t:[
  ['mat1','Operações com números reais; MMC e MDC (itens 1 e 2)'],
  ['mat3','Razão e proporção; regra de três simples e composta (itens 3 e 5)'],
  ['mat4','Porcentagem; juros simples (itens 4 e 7)'],
  ['mat6','Média aritmética simples e ponderada (item 6)'],
  ['mat8','Equações do 1º e 2º graus; sistemas (itens 8 e 9)'],
  ['mat10','Tabelas e gráficos; sistemas de medidas (itens 10 e 11)'],
  ['mat12','Noções de geometria (item 12)'],
  ['mat13','Resolução de situações-problema (item 13)']]},
 {id:'inf',b:'III',nome:'Informática',t:[
  ['inf1','MS-Windows 10 ou superior'],['inf2','MS-Word (Microsoft 365)'],['inf3','MS-Excel (Microsoft 365)'],
  ['inf4','Correio eletrônico'],['inf5','Internet'],['inf6','MS Teams'],['inf7','OneDrive']]},
 {id:'rl',b:'III',nome:'Raciocínio Lógico',t:[
  ['rl1','Estruturas lógicas e relações arbitrárias'],['rl2','Lógica de argumentação'],
  ['rl3','Diagramas lógicos'],['rl4','Sequências numéricas ou figurais']]}];
/* Composição da prova (para o simulado) */
const COTAS=[[['lp'],16],[['dp','dpp','dpc','dc','da','li'],30],[['at'],4],[['mat'],4],[['inf'],9],[['rl'],7]];
const MOTIVOS=['Não sabia o conteúdo','Confundi conceitos','Desatenção na leitura','Erro de interpretação','Chutei','Faltou tempo'];

/* ===== Banco de questões =====
 Campos: id, fonte, disc, top, enun, alts[5], gab (0-4), fora (true = assunto fora do edital 2026), ex (true = exemplo) */
const QUESTOES=[
{id:'ex1',fonte:'Exemplo (não é de prova)',ex:true,disc:'lp',top:'lp12',enun:'Assinale a alternativa em que o acento indicativo de crase está empregado corretamente.',alts:['O ofício foi entregue à ela ontem.','O escrevente referiu-se à decisão do juiz.','Ele começou à trabalhar muito cedo.','As partes ficaram frente à frente.','O oficial foi à pé até o fórum.'],gab:1},
{id:'ex2',fonte:'Exemplo (não é de prova)',ex:true,disc:'lp',top:'lp9',enun:'Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão.',alts:['Fazem dois anos que o processo foi arquivado.','Houveram muitas audiências nesta semana.','Havia muitos processos sobre a mesa.','Existe muitas dúvidas sobre o prazo.','Devem haver soluções mais rápidas.'],gab:2},
{id:'ex3',fonte:'Exemplo (não é de prova)',ex:true,disc:'mat',top:'mat4',enun:'De um lote de 240 processos, 15% foram arquivados. O número de processos arquivados foi',alts:['24','30','36','40','45'],gab:2},
{id:'ex4',fonte:'Exemplo (não é de prova)',ex:true,disc:'mat',top:'mat3',enun:'Três escreventes, trabalhando no mesmo ritmo, cadastram 120 processos em 4 horas. No mesmo ritmo, cinco escreventes cadastrarão, em 6 horas,',alts:['200 processos','240 processos','270 processos','300 processos','360 processos'],gab:3},
{id:'ex5',fonte:'Exemplo (não é de prova)',ex:true,disc:'rl',top:'rl4',enun:'Na sequência 2, 5, 11, 23, 47, …, mantida a regularidade, o próximo termo é',alts:['71','83','94','95','97'],gab:3},
{id:'ex6',fonte:'Exemplo (não é de prova)',ex:true,disc:'dc',top:'dc4',enun:'Nos termos do caput do art. 37 da Constituição Federal, a administração pública obedecerá aos princípios de',alts:['legalidade, impessoalidade, moralidade, publicidade e eficiência.','legalidade, pessoalidade, moralidade, publicidade e economicidade.','legitimidade, impessoalidade, moralidade, sigilo e eficiência.','legalidade, impessoalidade, razoabilidade, publicidade e celeridade.','legalidade, isonomia, moralidade, transparência e eficácia.'],gab:0},
{id:'ex7',fonte:'Exemplo (não é de prova)',ex:true,disc:'dp',top:'dp2',enun:'O funcionário público que se apropria de dinheiro de que tem a posse em razão do cargo comete o crime de',alts:['concussão.','corrupção passiva.','prevaricação.','peculato.','excesso de exação.'],gab:3},
{id:'ex8',fonte:'Exemplo (não é de prova)',ex:true,disc:'dpc',top:'dpc4',enun:'No procedimento comum do Código de Processo Civil, o prazo para o réu oferecer contestação é de',alts:['5 dias.','10 dias.','15 dias.','20 dias.','30 dias.'],gab:2},
{id:'ex9',fonte:'Exemplo (não é de prova)',ex:true,disc:'inf',top:'inf3',enun:'Em uma planilha do MS-Excel, as células A1, A2 e A3 contêm os valores 2, 3 e 5. O resultado da fórmula =SOMA(A1:A3) é',alts:['5','7','8','10','30'],gab:3}
];

/* ===== Estado e armazenamento ===== */
const KEY='tjsp_escrevente_v1';
let S={q:{},cad:{},sims:[]},salva=true;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));localStorage.setItem(KEY,JSON.stringify(S));}catch(e){salva=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){salva=false;}}
const QM={};QUESTOES.forEach(q=>QM[q.id]=q);
const DM={},TM={};DISC.forEach(d=>{DM[d.id]=d;d.t.forEach(t=>TM[t[0]]={id:t[0],nome:t[1],d:d});});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L='ABCDE';
function reg(id){return S.q[id]||(S.q[id]={n:0,w:0,note:'',tags:[]});}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pct(c,r){return r?Math.round(100*c/r):0;}

/* ===== Estatísticas (última resposta de cada questão, só assuntos do edital atual) ===== */
function stats(){
 const st={b:{},d:{},t:{},tot:{r:0,c:0}};
 const add=(o,k,ok)=>{o[k]=o[k]||{r:0,c:0};o[k].r++;if(ok)o[k].c++;};
 QUESTOES.forEach(q=>{const r=S.q[q.id];if(!r||r.last==null||q.fora)return;
  add(st.b,DM[q.disc].b,r.ok);add(st.d,q.disc,r.ok);add(st.t,q.top,r.ok);st.tot.r++;if(r.ok)st.tot.c++;});
 return st;}

/* ===== Navegação ===== */
let view='inicio',ses=null,filtro={disc:'',top:'',tipo:'todas'};
const TABS=[['inicio','Início'],['praticar','Praticar'],['erros','Erros'],['indic','Indicadores'],['notas','Anotações']];
function go(v){view=v;render();window.scrollTo(0,0);}
function render(){
 $('#nav').innerHTML=TABS.map(t=>`<button data-go="${t[0]}" class="${view===t[0]||(view==='q'&&t[0]==='praticar')?'on':''}">${t[1]}</button>`).join('');
 $('#main').innerHTML=({inicio:vInicio,praticar:vPraticar,q:vQuestao,fim:vFim,erros:vErros,indic:vIndic,notas:vNotas}[view])();
}

/* ===== Início ===== */
function vInicio(){
 const st=stats(),reais=QUESTOES.filter(q=>!q.ex).length;
 let h=`<h1>Escrevente Técnico Judiciário – TJSP</h1><p class="mut">Edital nº 02/2026 · Vunesp · prova em 14/03/2027 · 70 questões</p>`;
 if(!salva)h+=`<div class="fb warn">Este navegador não está guardando seu progresso neste modo. Use "Exportar progresso" antes de fechar.</div>`;
 if(window.offOK)h+=`<p class="mut">✓ Pronto para usar sem internet neste aparelho.</p>`;
 if(!reais)h+=`<div class="fb warn">Por enquanto há só ${QUESTOES.length} questões de exemplo, para você testar. As questões de provas anteriores entram quando os PDFs forem enviados.</div>`;
 h+=`<div class="grid"><div class="card"><div class="mut">Questões no banco</div><div class="big">${QUESTOES.length}</div></div>
 <div class="card"><div class="mut">Respondidas</div><div class="big">${st.tot.r}</div></div>
 <div class="card"><div class="mut">Acertos</div><div class="big">${st.tot.r?pct(st.tot.c,st.tot.r)+'%':'–'}</div></div></div>`;
 h+=`<h2>Mínimos para não ser eliminada</h2>`+BLOCOS.map(b=>blocoCard(b,st.b[b.id])).join('');
 h+=`<p class="mut">Além disso, a nota final precisa ser 5 ou mais: pelo menos 35 acertos nas 70 questões.</p>`;
 h+=`<div class="row" style="margin-top:14px"><button class="btn" data-go="praticar">Praticar</button><button class="btn sec" data-act="simulado">Simulado no formato da prova</button></div>`;
 h+=`<h2>Seu progresso</h2><div class="card"><p class="mut">O progresso fica salvo neste aparelho. Para levar do celular para o tablet (ou guardar uma cópia), exporte aqui e importe no outro.</p>
 <div class="row"><button class="btn sec sm" data-act="exp">Exportar progresso</button><button class="btn sec sm" data-act="imp">Importar progresso</button><button class="btn sec sm" data-act="zerar">Zerar tudo</button></div>
 <input type="file" id="fimp" accept=".json,application/json" hidden><div id="expbox"></div></div>`;
 return h;}
function blocoCard(b,s){
 s=s||{r:0,c:0};const p=pct(s.c,s.r),proj=Math.round(b.n*s.c/(s.r||1));
 let sit='<span class="tag">sem respostas ainda</span>';
 if(s.r){ if(!b.elim)sit='<span class="tag">só classifica</span>';
  else if(s.r<5)sit='<span class="tag w">poucas respostas</span>';
  else sit=p>=50?'<span class="tag g">acima do mínimo</span>':'<span class="tag b">abaixo do mínimo</span>';}
 return `<div class="card"><div class="line"><h3>${b.nome}</h3>${sit}</div>
 <div class="bar"><i class="${b.elim&&p<50?'low':''}" style="width:${p}%"></i>${b.elim?'<u></u>':''}</div>
 <div class="line mut"><span>${s.c} de ${s.r} certas (${s.r?p+'%':'–'})</span><span>${b.elim?`mínimo: ${b.min} de ${b.n}`:`${b.n} questões`}</span></div>
 ${s.r&&b.elim?`<div class="mut">Nesse ritmo, você acertaria cerca de ${proj} das ${b.n} da prova.</div>`:''}</div>`;}

/* ===== Praticar ===== */
function pool(){
 return QUESTOES.filter(q=>{
  if(filtro.disc&&q.disc!==filtro.disc)return false;
  if(filtro.top&&q.top!==filtro.top)return false;
  const r=S.q[q.id];
  if(filtro.tipo==='novas')return !r||r.last==null;
  if(filtro.tipo==='erradas')return r&&r.last!=null&&!r.ok;
  if(filtro.tipo==='marcadas')return r&&r.flag;
  if(filtro.tipo==='edital')return !q.fora;
  return true;});}
function vPraticar(){
 const d=DM[filtro.disc],n=pool().length;
 return `<h1>Praticar</h1><div class="card">
 <label>Disciplina</label><select data-f="disc"><option value="">Todas</option>${DISC.map(x=>`<option value="${x.id}" ${x.id===filtro.disc?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>
 <label>Assunto do edital</label><select data-f="top"><option value="">Todos</option>${d?d.t.map(t=>`<option value="${t[0]}" ${t[0]===filtro.top?'selected':''}>${esc(t[1])}</option>`).join(''):''}</select>
 <label>Quais questões</label><select data-f="tipo">${[['todas','Todas'],['novas','Ainda não respondidas'],['erradas','Que eu errei'],['marcadas','Marcadas para revisar'],['edital','Só assuntos do edital 2026']].map(o=>`<option value="${o[0]}" ${o[0]===filtro.tipo?'selected':''}>${o[1]}</option>`).join('')}</select>
 <p class="mut" style="margin-top:12px">${n} questão(ões) com esse filtro.</p>
 <div class="row"><button class="btn" data-act="ini" ${n?'':'disabled'}>Começar</button><button class="btn sec" data-act="simulado">Simulado</button></div></div>
 <p class="mut">No modo Praticar a correção aparece na hora, com espaço para anotar. No Simulado, o resultado só aparece no final, como na prova.</p>`;}
function iniciar(ids,modo){ses={ids:ids,i:0,modo:modo,resp:{},feito:false};go('q');}
function simulado(){
 let ids=[];COTAS.forEach(c=>{ids=ids.concat(shuffle(QUESTOES.filter(q=>!q.fora&&c[0].includes(q.disc))).slice(0,c[1]).map(q=>q.id));});
 if(!ids.length)return;iniciar(ids,'sim');}

/* ===== Questão ===== */
function vQuestao(){
 const q=QM[ses.ids[ses.i]],r=reg(q.id),sim=ses.modo==='sim',esc_=ses.resp[q.id],resp=!sim&&esc_!=null;
 let h=`<div class="line mut"><span>${sim?'Simulado':'Prática'} · ${ses.i+1} de ${ses.ids.length}</span><button class="btn sec sm" data-act="sair">Sair</button></div>
 <div style="margin:8px 0"><span class="tag">${esc(DM[q.disc].nome)}</span><span class="tag">${esc(q.fonte)}</span>${q.fora?'<span class="tag w">fora do edital 2026</span>':''}</div>
 <div class="card enun">${esc(q.enun)}${q.img?`<br><img src="${q.img}" style="max-width:100%" alt="">`:''}</div>`;
 h+=q.alts.map((a,i)=>{let c='';
  if(resp){if(i===q.gab)c='ok';else if(i===esc_)c='bad';}else if(esc_===i)c='sel';
  return `<button class="alt ${c}" data-alt="${i}" ${resp?'disabled':''}><b>${L[i]}</b><span>${esc(a)}</span></button>`;}).join('');
 if(resp)h+=correcao(q,r,esc_===q.gab);
 h+=`<div class="row" style="margin-top:12px">${ses.i>0?'<button class="btn sec" data-act="ant">Anterior</button>':''}
 ${ses.i<ses.ids.length-1?`<button class="btn" data-act="prox">Próxima</button>`:`<button class="btn" data-act="fim">${sim?'Finalizar e corrigir':'Concluir'}</button>`}
 <button class="chip ${r.flag?'on':''}" data-flag="${q.id}">${r.flag?'★ Marcada':'☆ Marcar para revisar'}</button></div>`;
 return h;}
function correcao(q,r,ok){
 const t=TM[q.top];
 let h=`<div class="fb ${ok?'ok':'bad'}">${ok?'Acertou!':'Errou. Gabarito: '+L[q.gab]}</div>
 <div class="card"><div class="mut">${q.fora?'Assunto (não está no edital 2026, não precisa priorizar)':ok?'Assunto do edital':'O que estudar (edital 2026)'}</div><b>${esc(t.d.nome)}</b><br>${esc(t.nome)}`;
 if(!ok)h+=`<label>Por que errei?</label><div class="row">${MOTIVOS.map(m=>`<button class="chip ${r.tags.includes(m)?'on':''}" data-tag="${esc(m)}" data-id="${q.id}">${m}</button>`).join('')}</div>`;
 h+=`<label>Minha anotação sobre esta questão</label><textarea data-note="${q.id}" placeholder="${ok?'Algo para lembrar…':'O que eu preciso lembrar para não errar de novo?'}">${esc(r.note)}</textarea></div>`;
 return h;}
function responder(i){
 const q=QM[ses.ids[ses.i]];ses.resp[q.id]=i;
 if(ses.modo!=='sim')gravar(q,i);
 render();}
function gravar(q,i){const r=reg(q.id);r.last=i;r.ok=i===q.gab;r.n++;if(!r.ok)r.w++;r.quando=Date.now();save();}

/* ===== Fim de sessão ===== */
function vFim(){
 const sim=ses.modo==='sim';let c=0,n=0;const pb={};
 ses.ids.forEach(id=>{const q=QM[id],a=ses.resp[id];
  if(sim&&!ses.feito){ if(a!=null)gravar(q,a); }
  if(!sim&&a==null)return;
  const b=DM[q.disc].b;pb[b]=pb[b]||{r:0,c:0};pb[b].r++;n++;if(a===q.gab){pb[b].c++;c++;}});
 if(sim&&!ses.feito){ses.feito=true;S.sims.push({d:Date.now(),c:c,n:n});save();}
 let h=`<h1>${sim?'Resultado do simulado':'Sessão concluída'}</h1><div class="card"><div class="big">${c} de ${n}</div><div class="mut">${sim?'Nota: '+(n?(10*c/n).toFixed(2).replace('.',','):'–')+' (mínimo 5,00)':'questões certas'}</div></div>`;
 if(sim){let elim=n&&10*c/n<5;
  h+=BLOCOS.map(b=>{const s=pb[b.id]||{r:0,c:0},min=Math.ceil(s.r/2),okb=!b.elim||s.c>=min;if(!okb)elim=true;
   return `<div class="card"><div class="line"><h3>${b.nome}</h3><span class="tag ${okb?'g':'b'}">${b.elim?(okb?'atingiu o mínimo':'abaixo do mínimo'):'só classifica'}</span></div><div class="mut">${s.c} de ${s.r}${b.elim?` · mínimo ${min}`:''}</div></div>`;}).join('');
  h+=`<div class="fb ${elim?'bad':'ok'}">${elim?'Com esse resultado você seria eliminada. Veja a aba Erros para corrigir questão por questão.':'Com esse resultado você estaria habilitada na prova objetiva.'}</div>`;
  if(n<70)h+=`<p class="mut">Este simulado teve ${n} questões porque o banco ainda não tem as 70 na proporção da prova.</p>`;}
 h+=`<div class="row"><button class="btn" data-go="erros">Corrigir meus erros</button><button class="btn sec" data-go="indic">Ver indicadores</button></div>`;
 return h;}

/* ===== Erros (correção interativa) ===== */
function erradas(){return QUESTOES.filter(q=>{const r=S.q[q.id];return r&&r.last!=null&&!r.ok;}).sort((a,b)=>(S.q[b.id].quando||0)-(S.q[a.id].quando||0));}
function vErros(){
 const e=erradas();
 let h=`<h1>Caderno de erros</h1>`;
 if(!e.length)return h+`<div class="card">Nenhuma questão errada no momento. Quando você errar, ela aparece aqui para corrigir e anotar.</div>`;
 h+=`<p class="mut">${e.length} questão(ões) para corrigir. Ao acertar na refação, a questão sai daqui (a anotação continua na aba Anotações).</p><button class="btn" data-act="reerr">Refazer todas</button>`;
 h+=e.map(q=>{const r=S.q[q.id],t=TM[q.top];
  return `<div class="card"><div><span class="tag">${esc(t.d.nome)}</span><span class="tag">${esc(q.fonte)}</span>${q.fora?'<span class="tag w">fora do edital 2026</span>':''}${r.w>1?`<span class="tag b">errada ${r.w}x</span>`:''}</div>
  <details><summary>${esc(q.enun.slice(0,110))}${q.enun.length>110?'…':''}</summary><div class="enun" style="margin:8px 0">${esc(q.enun)}</div>
  ${q.alts.map((a,i)=>`<div class="alt ${i===q.gab?'ok':i===r.last?'bad':''}" style="cursor:default"><b>${L[i]}</b><span>${esc(a)}${i===q.gab?' — gabarito':i===r.last?' — sua resposta':''}</span></div>`).join('')}</details>
  <div class="mut" style="margin-top:6px">${q.fora?'Assunto':'Estudar'}: ${esc(t.nome)}</div>
  <label>Por que errei?</label><div class="row">${MOTIVOS.map(m=>`<button class="chip ${r.tags.includes(m)?'on':''}" data-tag="${esc(m)}" data-id="${q.id}">${m}</button>`).join('')}</div>
  <label>Minha anotação</label><textarea data-note="${q.id}" placeholder="O que eu preciso lembrar para não errar de novo?">${esc(r.note)}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn sec sm" data-re="${q.id}">Refazer esta</button></div></div>`;}).join('');
 return h;}

/* ===== Indicadores ===== */
function vIndic(){
 const st=stats();
 let h=`<h1>Indicadores</h1><p class="mut">Contam a última resposta de cada questão e só assuntos do edital 2026. A linha preta marca os 50%.</p>`;
 if(!st.tot.r)return h+`<div class="card">Responda algumas questões para os indicadores aparecerem.</div>`;
 h+=BLOCOS.map(b=>blocoCard(b,st.b[b.id])).join('');
 const proj=BLOCOS.reduce((a,b)=>{const s=st.b[b.id];return a+(s&&s.r?b.n*s.c/s.r:0);},0);
 h+=`<div class="card"><div class="mut">Projeção para a prova (blocos já respondidos)</div><div class="big">${Math.round(proj)} de 70</div><div class="mut">Nota 5 exige 35 acertos.</div></div>`;
 /* prioridades */
 const pri=Object.keys(st.t).map(k=>({t:TM[k],s:st.t[k]})).filter(x=>x.s.c<x.s.r)
  .sort((a,b)=>(DM[b.t.d.id].b!=='III')-(DM[a.t.d.id].b!=='III')||pct(a.s.c,a.s.r)-pct(b.s.c,b.s.r)||(b.s.r-b.s.c)-(a.s.r-a.s.c));
 h+=`<h2>O que estudar primeiro</h2>`;
 h+=pri.length?`<div class="card">${pri.slice(0,12).map((x,i)=>`<div style="padding:6px 0;${i?'border-top:1px solid var(--line)':''}"><div class="line"><b>${i+1}. ${esc(x.t.d.nome)}</b><span class="tag ${x.t.d.b==='III'?'':'b'}">${x.t.d.b==='III'?'classificatório':'eliminatório'}</span></div><div>${esc(x.t.nome)}</div><div class="mut">${x.s.r-x.s.c} erro(s) em ${x.s.r} · ${pct(x.s.c,x.s.r)}% de acerto</div></div>`).join('')}</div><p class="mut">Ordem: primeiro os blocos eliminatórios (I e II), depois o menor percentual de acerto.</p>`:`<div class="card">Nenhum assunto com erro pendente.</div>`;
 /* motivos */
 const mot={};Object.keys(S.q).forEach(id=>{const r=S.q[id];if(QM[id]&&r.last!=null&&!r.ok)(r.tags||[]).forEach(m=>mot[m]=(mot[m]||0)+1);});
 if(Object.keys(mot).length)h+=`<h2>Por que você erra</h2><div class="card">${Object.keys(mot).sort((a,b)=>mot[b]-mot[a]).map(m=>`<div class="line"><span>${esc(m)}</span><b>${mot[m]}</b></div>`).join('')}</div>`;
 /* por disciplina e assunto */
 h+=`<h2>Por disciplina e assunto</h2>`+DISC.map(d=>{const s=st.d[d.id];if(!s)return `<div class="card"><div class="line"><h3>${esc(d.nome)}</h3><span class="mut">sem respostas</span></div></div>`;
  const p=pct(s.c,s.r);
  return `<div class="card"><details><summary><div class="line" style="display:inline-flex;width:92%"><b>${esc(d.nome)}</b><span>${s.c}/${s.r} · ${p}%</span></div></summary>
  ${d.t.map(t=>{const x=st.t[t[0]];if(!x)return `<div class="mut" style="margin-top:8px">${esc(t[1])} — sem respostas</div>`;const pp=pct(x.c,x.r);
   return `<div style="margin-top:8px"><div style="font-size:.92rem">${esc(t[1])}</div><div class="bar"><i class="${pp<50?'low':''}" style="width:${pp}%"></i><u></u></div><div class="mut">${x.c}/${x.r} · ${pp}%</div></div>`;}).join('')}
  </details><div class="bar"><i class="${p<50?'low':''}" style="width:${p}%"></i><u></u></div></div>`;}).join('');
 if(S.sims.length)h+=`<h2>Simulados feitos</h2><div class="card">${S.sims.slice().reverse().map(x=>`<div class="line"><span>${new Date(x.d).toLocaleDateString('pt-BR')}</span><b>${x.c} de ${x.n}</b></div>`).join('')}</div>`;
 return h;}

/* ===== Anotações ===== */
function vNotas(){
 const com=QUESTOES.filter(q=>S.q[q.id]&&S.q[q.id].note&&S.q[q.id].note.trim());
 let h=`<h1>Anotações</h1><h2>Caderno por disciplina</h2><p class="mut">Espaço livre para resumos, artigos para decorar, macetes. Salva sozinho.</p>`;
 h+=DISC.map(d=>`<div class="card"><details ${S.cad[d.id]?'open':''}><summary><b>${esc(d.nome)}</b></summary><textarea data-cad="${d.id}" style="min-height:120px;margin-top:8px" placeholder="Anotações de ${esc(d.nome)}…">${esc(S.cad[d.id]||'')}</textarea></details></div>`).join('');
 h+=`<h2>Anotações nas questões (${com.length})</h2>`;
 h+=com.length?com.map(q=>{const r=S.q[q.id];return `<div class="card"><div><span class="tag">${esc(DM[q.disc].nome)}</span><span class="tag ${r.ok?'g':'b'}">${r.ok?'acertei':'errei'}</span></div><div class="mut">${esc(q.enun.slice(0,120))}${q.enun.length>120?'…':''}</div><div class="mut">${esc(TM[q.top].nome)}</div><textarea data-note="${q.id}" style="margin-top:8px">${esc(r.note)}</textarea><div class="row" style="margin-top:8px"><button class="btn sec sm" data-re="${q.id}">Refazer</button></div></div>`;}).join(''):`<div class="card">As anotações que você escrever depois de responder uma questão aparecem aqui.</div>`;
 return h;}

/* ===== Eventos ===== */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-act],[data-alt],[data-flag],[data-tag],[data-re]');if(!t)return;
 const d=t.dataset;
 if(d.go)return go(d.go);
 if(d.alt!=null)return responder(+d.alt);
 if(d.flag){const r=reg(d.flag);r.flag=!r.flag;save();return render();}
 if(d.tag){const r=reg(d.id),i=r.tags.indexOf(d.tag);i<0?r.tags.push(d.tag):r.tags.splice(i,1);save();t.classList.toggle('on');return;}
 if(d.re)return iniciar([d.re],'pra');
 switch(d.act){
  case 'ini':return iniciar(shuffle(pool()).map(q=>q.id),'pra');
  case 'simulado':return simulado();
  case 'reerr':return iniciar(shuffle(erradas()).map(q=>q.id),'pra');
  case 'prox':ses.i++;return go('q');
  case 'ant':ses.i--;return go('q');
  case 'fim':return go('fim');
  case 'sair':return go(ses.modo==='sim'?'fim':'praticar');
  case 'exp':return exportar();
  case 'imp':return $('#fimp').click();
  case 'zerar':if(t.dataset.ok){S={q:{},cad:{},sims:[]};save();return render();}t.dataset.ok=1;t.textContent='Toque de novo para confirmar';return;
 }});
document.addEventListener('input',e=>{const d=e.target.dataset;
 if(d.note){reg(d.note).note=e.target.value;save();}
 if(d.cad){S.cad[d.cad]=e.target.value;save();}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f){filtro[t.dataset.f]=t.value;if(t.dataset.f==='disc')filtro.top='';render();}
 if(t.id==='fimp'&&t.files[0]){const fr=new FileReader();fr.onload=()=>importar(fr.result);fr.readAsText(t.files[0]);}
 if(t.id==='timp')importar(t.value);});
function exportar(){
 const txt=JSON.stringify(S);
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='tjsp-progresso-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}
 $('#expbox').innerHTML=`<label>Se o arquivo não baixar, copie o texto abaixo e guarde (ou cole no outro aparelho):</label><textarea readonly onclick="this.select()">${esc(txt)}</textarea><label>Para importar colando, cole aqui e toque fora da caixa:</label><textarea id="timp"></textarea>`;}
function importar(txt){
 try{const o=JSON.parse(txt);if(!o||typeof o.q!=='object')throw 0;S={q:o.q||{},cad:o.cad||{},sims:o.sims||[]};save();render();}
 catch(e){$('#expbox').innerHTML='<div class="fb bad">Não consegui ler esse arquivo de progresso.</div>';}}
render();
/* App instalável: guarda os arquivos no aparelho para funcionar sem internet */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{window.offOK=true;if(view==='inicio')render();}).catch(()=>{});}
</script>
</body>
